name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing (OIDC) needs Node >= 22.14 and npm >= 11.5.1.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Node's bundled npm may predate OIDC support; >= 11.15 also covers `npm stage publish`.
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:integration -- --exclude tests/integration/parse-pool-workers.test.ts
      # No token: npm authenticates via the trusted publisher configured on npmjs.com
      # (phash/PindeX, publish.yml, direct publish allowed). Provenance is attached automatically.
      - run: npm publish --access public
